<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Vanessa Dashboard</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    th { background: #eee; }
    button { margin: 5px; padding: 6px 10px; }
  </style>
</head>
<body>
  <h2>Vanessa Call Dashboard</h2>

  <div>
    <input id="numberInput" placeholder="+15551234567" />
    <button id="callBtn">Call</button>
    <button id="autoBtn">Auto Call</button>
  </div>

  <table>
    <thead>
      <tr><th>Name</th><th>Phone</th><th>Status</th><th>Notes</th><th>Price</th><th>Timing</th><th>Condition</th><th>Last Call</th></tr>
    </thead>
    <tbody id="ownersTable"></tbody>
  </table>

  <script src="dashboard.js"></script>
</body>
</html>
